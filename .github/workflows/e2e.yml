# Suite e2e complète — ASYNCHRONE, ne bloque jamais personne.
#
# C'est l'« étape secondaire » du pipeline de déploiement (Humble & Farley) : l'étape bloquante
# reste locale et rapide (`/ci-gate fast`, 43 s), celle-ci prend le temps qu'il faut et se consulte
# APRÈS coup — `pnpm e2e:status`, ou le skill `/e2e-status`.
#
# Ce qui a rendu ça possible le 2026-09-05 (décision #924) : le harnais sert un BUILD au lieu du
# serveur de développement. La décision d'origine — « rendu Babylon instable en CI headless ubuntu,
# même avec SwiftShader → tous les tests combat timeout » — était juste sur les faits et fausse sur
# la cause : le runner n'a que 4 vCPU, et il devait les partager entre Chromium en rendu logiciel ET
# Vite qui transformait le graphe de modules à la volée à chaque navigation. Sans Vite, SwiftShader
# passe. Mesuré : 531 tests, 8 tranches, **4 min 48 s de mur**, tout vert.
#
# (Mesa llvmpipe, la piste que la littérature donnait gagnante, n'obtient AUCUN contexte WebGL —
# ni ici, ni en local. Question tranchée, ne pas la rouvrir sans nouvelle mesure.)
#
# Le dépôt est public : minutes de runner gratuites et illimitées, et le plan Free autorise 20 jobs
# simultanés — 8 tranches n'en approchent pas.
name: e2e — suite complète

on:
  push:
    branches: [main]
  # Une fois par nuit : attrape ce qui pourrit sans qu'on pousse (dépendance, image de runner).
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# Un push qui suit de près le précédent annule la suite en cours : son verdict porterait sur du
# code déjà remplacé.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Une tranche rouge ne doit pas masquer le verdict des sept autres : on veut la liste complète
      # de ce qui casse, pas le premier échec.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium

      - name: Tranche ${{ matrix.shard }}/8
        env:
          # Le rasteriseur logiciel embarqué : le runner n'a pas de carte graphique.
          PT_GL: swiftshader
          # 2 sur 4 vCPU — deux Chromium en rendu logiciel se partagent la machine sans se
          # l'arracher. Mesuré : 66 tests par tranche en 1,8 à 4,0 min.
          PT_E2E_WORKERS: "2"
        # Le rapport `blob` — le format que `merge-reports` sait recoudre — vient déjà de
        # `playwright.config.ts`, qui le pose sous `CI`. Ne pas le redire ici : deux sources pour
        # un même réglage finissent par diverger.
        run: npx playwright test --shard=${{ matrix.shard }}/8

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-${{ matrix.shard }}
          path: blob-report/
          retention-days: 3
          if-no-files-found: ignore

  # Recoud les 8 rapports en un seul, pour qu'un échec se lise à un seul endroit plutôt que dans
  # huit journaux de job.
  rapport:
    needs: suite
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v5
        with:
          path: tranches
          pattern: blob-*
          merge-multiple: true

      - run: npx playwright merge-reports --reporter=html tranches

      - uses: actions/upload-artifact@v4
        with:
          name: rapport-e2e
          path: playwright-report/
          retention-days: 14
