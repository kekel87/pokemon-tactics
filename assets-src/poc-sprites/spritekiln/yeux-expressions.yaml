            half: '[0.05 + 0.04*pulse(yaw, 90, 50), 0.0235, 0.07 - 0.03*pulse(yaw, 90, 50)]'
    head:
      paint:
      - material: ink
        prims:
        - box:
            c: '[(0.095 + 0.01*pulse(yaw, -90, 50) - 0.02*pulse(yaw, 45, 30)), 0.125 - 0.03*pulse(yaw, -90, 50) - 0.07*pulse(yaw, 45, 30), 0.11 - 0.15*pulse(yaw, 90, 50)]'
            half: '[0.05 + 0.04*pulse(yaw, -90, 50), 0.0235, 0.07 - 0.03*pulse(yaw, -90, 50)]'
        - box:
