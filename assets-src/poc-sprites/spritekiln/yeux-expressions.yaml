# Expressions des yeux validées le 2026-11-12, à copier dans un personnage (une liste remplace celle du gabarit).
# Les x sont calés pour le head.scale indiqué : x = 1,5 x camera.scale / head.scale ; recalculer sinon.
normaux (Red, head.scale 1.55):
  parts:
    head:
      paint:
      - material: ink
        prims:
        - box:
            c: '[(0.063 + 0.05*pulse(yaw, -90, 50) - 0.025*pulse(yaw, 45, 30)), 0.115, 0.13 - 0.06*pulse(yaw, -90, 50) - 0.15*pulse(yaw, 90, 50)]'
            half: '[0.018, 0.05, 0.05 - 0.032*pulse(yaw, -90, 50)]'
        - box:
            c: '[-(0.063 + 0.05*pulse(yaw, 90, 50) - 0.025*pulse(yaw, -45, 30)), 0.115, 0.13 - 0.06*pulse(yaw, 90, 50) - 0.15*pulse(yaw, -90, 50)]'
            half: '[0.018, 0.05, 0.05 - 0.032*pulse(yaw, 90, 50)]'
