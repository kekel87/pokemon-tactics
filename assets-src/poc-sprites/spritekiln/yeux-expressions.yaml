            half: '[0.05 + 0.04*pulse(yaw, 90, 50), 0.0235, 0.07 - 0.03*pulse(yaw, 90, 50)]'
ouverts (Ondine, head.scale 1.55, reflet):
  ramps:
    eye_shine:
    - '#bff6ee'
    - '#e8fffb'
  materials:
    shine:
      ramp: eye_shine
      emissive: true
      band: 0
      outline: false
  parts:
    head:
      paint:
      - material: shine
        prims:
        - box:
            c: '[(0.063 + 0.05*pulse(yaw, -90, 50) - 0.025*pulse(yaw, 45, 30)), 0.15 + 0.012*pulse(yaw, -90, 50), 0.13 - 0.06*pulse(yaw, -90, 50) - 0.15*pulse(yaw, 90, 50)]'
            half: '[0.018 + 0.022*pulse(yaw, -90, 50), 0.05 + 0.012*pulse(yaw, -90, 50), 0.05 - 0.032*pulse(yaw, -90, 50)]'
        - box:
            c: '[-(0.063 + 0.05*pulse(yaw, 90, 50) - 0.025*pulse(yaw, -45, 30)), 0.15 + 0.012*pulse(yaw, 90, 50), 0.13 - 0.06*pulse(yaw, 90, 50) - 0.15*pulse(yaw, -90, 50)]'
            half: '[0.018 + 0.022*pulse(yaw, 90, 50), 0.05 + 0.012*pulse(yaw, 90, 50), 0.05 - 0.032*pulse(yaw, 90, 50)]'
      - material: ink
        prims:
        - box:
            c: '[(0.063 + 0.05*pulse(yaw, -90, 50) - 0.025*pulse(yaw, 45, 30)), 0.115, 0.13 - 0.06*pulse(yaw, -90, 50) - 0.15*pulse(yaw, 90, 50)]'
            half: '[0.018 + 0.022*pulse(yaw, -90, 50), 0.05 + 0.025*pulse(abs(yaw), 45, 30), 0.05 - 0.032*pulse(yaw, -90, 50)]'
        - box:
            c: '[-(0.063 + 0.05*pulse(yaw, 90, 50) - 0.025*pulse(yaw, -45, 30)), 0.115, 0.13 - 0.06*pulse(yaw, 90, 50) - 0.15*pulse(yaw, -90, 50)]'
            half: '[0.018 + 0.022*pulse(yaw, 90, 50), 0.05 + 0.025*pulse(abs(yaw), 45, 30), 0.05 - 0.032*pulse(yaw, 90, 50)]'
      - material: shine
        prims:
        - box:
            c: '[(0.063 + 0.05*pulse(yaw, -90, 50) - 0.025*pulse(yaw, 45, 30)), 0.165, 0.13 - 0.06*pulse(yaw, -90, 50) - 0.15*pulse(yaw, 90, 50)]'
            half: '[0.001 + 0.017*pulse(abs(yaw), 45, 30), 0.025, 0.05 - 0.032*pulse(yaw, -90, 50)]'
        - box:
            c: '[-(0.063 + 0.05*pulse(yaw, 90, 50) - 0.025*pulse(yaw, -45, 30)), 0.165, 0.13 - 0.06*pulse(yaw, 90, 50) - 0.15*pulse(yaw, -90, 50)]'
            half: '[0.001 + 0.017*pulse(abs(yaw), 45, 30), 0.025, 0.05 - 0.032*pulse(yaw, 90, 50)]'
